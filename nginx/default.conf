# Keep errors and POST reports visible while removing routine successful polls.
map "$request_method:$uri:$status" $ztp_access_log {
    default 1;
    ~^GET:/healthz:2[0-9][0-9]$ 0;
    ~^GET:/api/v1/provisioning(?:/[^/]+(?:/events)?)?:2[0-9][0-9]$ 0;
}

server {
    listen 80;
    access_log /var/log/nginx/access.log combined if=$ztp_access_log;
    root /deployment/web;

    # Resolve the ZTP service at request time through Docker DNS.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /cumulus-ztp {
        set $app_upstream http://ztp:8080;
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        set $app_upstream http://ztp:8080;
        proxy_pass $app_upstream;
    }

    location /api/ {
        set $app_upstream http://ztp:8080;
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin {
        set $app_upstream http://ztp:8080;
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/v1/provisioning {
        set $app_upstream http://ztp:8080;
        proxy_pass $app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 4k;
    }

}
